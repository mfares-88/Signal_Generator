

;///////////////////////************************Environment for ESP32-S3 LCD****************************////////////////

[env:esp32-s3-n4r8]
; Use the pioarduino platform (pick ONE of the two lines below)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;platform = https://github.com/pioarduino/platform-espressif32.git#develop

board     = esp32-s3-n4r8
framework = arduino
build_type = debug


; --- N4R8 (4MB QD flash, 8MB OPI PSRAM) + your Arduino Tools settings ---
board_build.f_cpu       = 240000000L
board_build.f_flash     = 80000000L
board_build.flash_mode  = dio
board_build.psram_type  = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_build.partitions  = partitions_signalgen.csv
board_build.filesystem  = littlefs

; USB CDC, Serial Plotter speed, and convenience flags
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -DSIGGEN_USE_LITTLEFS=1
  -DSIGGEN_BACKEND_TABLE=1
  -DSIGGEN_HAS_DISPLAY=1
  -I${PROJECT_DIR}/include
  -Wno-narrowing


; ---------------------------------------------------------------------------
; Cycle-7 WiFi companion notes (Agent C — documentary only, no build change)
; Framework: arduino-esp32 3.3.4 (via pioarduino platform-espressif32 stable).
;   wifi_link (lib/wifi_link/) requires: WiFi / Network / ESPmDNS / Preferences.
;   ALL FOUR are bundled with arduino-esp32 3.3.4 — NO new lib_deps are needed.
;   board_build.partitions = partitions_signalgen.csv  ← UNCHANGED (confirmed line 22).
;   Partition layout (partitions_signalgen.csv):
;     nvs   24 KiB  @ 0x9000   — existing NVS namespace 'siggen' + NEW namespace
;                                 'wifi' (~100 B for SSID/pass/provisioned flag).
;                                 Both namespaces fit comfortably; no resize required.
;     app0  ~2.938 MiB (0x2F0000) @ 0x10000 — factory firmware slot.
;                                 WiFi+lwIP+mDNS adds ~300–500 KB flash; fit must
;                                 be confirmed by the build phase (before/after
;                                 .text/.rodata/.bss + RAM from the linker map).
;     spiffs 1 MiB  @ 0x300000  — pattern storage; unchanged.
; ---------------------------------------------------------------------------
; NOTE on LittleFS: arduino-esp32 v2.0.4+ bundles the `LittleFS` Arduino library
; as part of the framework — no `lib_deps` entry is required. The
; `-DSIGGEN_USE_LITTLEFS=1` flag above is what gates our wrapper in
; lib/sweep_compression/LittleFSInit.{h,cpp}. WROOM env intentionally does not
; set this flag (per §8 risk #1 — WROOM has no LittleFS partition).
lib_deps =
  lvgl/lvgl@9.2.2
  moononournation/GFX Library for Arduino@1.6.4
  moononournation/Dev Device Pins@^0.0.2
  TAMC_GT911@^1.0.2

monitor_speed  = 921600
upload_speed   = 921600
monitor_eol     = LF                 ; your sketch expects '\n'
monitor_echo    = yes                ; show what you typed
monitor_filters = send_on_enter, time, esp32_exception_decoder


